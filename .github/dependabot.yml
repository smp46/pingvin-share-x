version: 2

# Minor and patch updates are grouped on purpose: individually they are noise,
# and one PR a week per project is something a person can actually look at.
#
# Majors are deliberately NOT grouped. Grouping them produced a single PR of
# eighteen breaking changes where two of them needed real thought and the other
# sixteen were held hostage behind those two, so nobody could review any of it.
# A major is a decision, and decisions arrive one at a time.
#
# Security updates are separate from all of this and are not affected by the
# limits here.
updates:
  - package-ecosystem: npm
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 6
    groups:
      backend-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 6
    groups:
      frontend-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      root-tooling:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns:
          - "*"
