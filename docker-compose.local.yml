services:
  pingvin-share-x:
    container_name: pingvin-share-x
    build: .
    restart: unless-stopped
    ports:
      - 3001:3000
    environment:
      - TRUST_PROXY=true
      - TRUST_PROXY_HOPS=1
    volumes:
      - "./data:/opt/app/backend/data:rw,z"
      - "./data/images:/opt/app/frontend/public/img:rw,z"
      # - "./config.yaml:/opt/app/config.yaml:ro,z"

