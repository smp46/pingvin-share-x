services:
  pingvin-share-x:
    container_name: pingvin-share-x
    build: .
    restart: unless-stopped
    depends_on:
      clamav:
        condition: service_healthy
    ports:
      - 3001:3000
    environment:
      # true so the bundled Caddy + backend actually honor X-Forwarded-For
      # and real client IPs land in ShareAccessLog instead of Caddy's own
      # loopback address. fine for a local lab with no real proxy in front;
      # in prod only set this when there IS a trusted reverse proxy in front.
      - TRUST_PROXY=true
      # uncomment while running backend/npm run test:integration, the suite
      # creates more accounts than the 20 per 5 minutes the limiter allows.
      # never do this on an instance anyone else can reach.
      - DISABLE_RATE_LIMIT=${DISABLE_RATE_LIMIT:-false}
    volumes:
      - "./data:/opt/app/backend/data:rw,z"
      - "./data/images:/opt/app/frontend/public/img:rw,z"
#      - "./config.yaml:/opt/app/config.yaml"

  clamav:
    container_name: pingvin-share-x-clamav
    restart: unless-stopped
    image: clamav/clamav-debian:latest
    environment:
      # clamd's INSTREAM/file size limits default well below pingvin's own
      # max share size (1GB by default), so anything over ~25MB got rejected
      # mid-scan instead of actually being scanned.
      - CLAMD_CONF_StreamMaxLength=2000M
      - CLAMD_CONF_MaxFileSize=2000M
      - CLAMD_CONF_MaxScanSize=2000M
    volumes:
      - "clamav-db:/var/lib/clamav"

volumes:
  clamav-db:

