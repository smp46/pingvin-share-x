services:
  pingvin-share-x:
    container_name: pingvin-share-x
    build: .
    restart: unless-stopped
    depends_on:
      clamav:
        condition: service_healthy
    ports:
      - 3001:3000
    environment:
      - TRUST_PROXY=false
    volumes:
      - "./data:/opt/app/backend/data:rw,z"
      - "./data/images:/opt/app/frontend/public/img:rw,z"
#      - "./config.yaml:/opt/app/config.yaml"

  clamav:
    container_name: pingvin-share-x-clamav
    restart: unless-stopped
    image: clamav/clamav-debian:latest
    environment:
      # clamd's INSTREAM/file size limits default well below pingvin's own
      # max share size (1GB by default), so anything over ~25MB got rejected
      # mid-scan instead of actually being scanned.
      - CLAMD_CONF_StreamMaxLength=2000M
      - CLAMD_CONF_MaxFileSize=2000M
      - CLAMD_CONF_MaxScanSize=2000M
    volumes:
      - "clamav-db:/var/lib/clamav"

volumes:
  clamav-db:

